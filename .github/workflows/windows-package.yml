name: Windows portable package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and smoke-test portable package
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Python tests
        shell: pwsh
        run: |
          .venv-build/Scripts/python.exe -m pip install pytest==8.4.2 httpx==0.28.1
          .venv-build/Scripts/python.exe -m pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frontend tests
        run: npm --prefix frontend test
      - uses: actions/upload-artifact@v4
        with:
          name: LMU-Telemetry-windows-x64
          path: dist/LMU-Telemetry-windows-x64.zip
          if-no-files-found: error
